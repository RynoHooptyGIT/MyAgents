# Software factory policy. Read by scripts/factory/policy.py.
# This file is a protected path: the factory can propose changes, never merge them.
# Syntax is a strict YAML subset (maps, lists of scalars, quoted globs).
version: 1

tiers:
  T0:
    spec_approval: none
    merge: automatic
  T1:
    spec_approval: none
    merge: automatic-digest
  T2:
    spec_approval: human
    merge: human

# Always T2, never promoted. Matching is case-insensitive, anchored at repo root.
# Includes everything scripts/test.sh executes or auto-discovers (pytest config and
# conftest, scripts/test-*.sh and .agents/hooks/test-*.sh harnesses, the contract and
# settings-drift checks and their inputs): a new file matching a discovery glob is T2.
protected_paths:
  - "scripts/factory/**"
  - ".factory/**"
  - "scripts/test.sh"
  - "scripts/test-*.sh"
  - "scripts/apply-contract.sh"
  - "scripts/check-settings-drift.sh"
  - "scripts/lib/**"
  - "templates/settings.local.json.template"
  - "**/conftest.py"
  - "**/pytest.ini"
  - ".github/**"
  - ".claude/**"
  - ".mcp.json"
  - ".gitmodules"
  - ".agents/**"
  - "hooks/**"
  - "team/engine/**"
  - "**/CLAUDE.md"
  - "**/CLAUDE.local.md"
  - "**/AGENTS.md"
  - "**/*secret*"
  - "**/*credential*"
  - "**/secrets/**"
  - "**/credentials/**"
  - "**/.env"
  - "**/.env.*"
  - "**/*.pem"
  - "**/*.key"
  - "**/id_rsa*"

# Paths eligible for T0 (docs and tests only).
t0_paths:
  - "docs/**"
  - "README.md"
  - "**/tests/**"
  - "**/test_*.py"
  - "**/test-*.sh"

# Test files. Deleting any of them is T2.
test_paths:
  - "**/tests/**"
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/test-*.sh"

# Touching any of these counts as a new dependency.
dependency_files:
  - "**/requirements*.txt"
  - "**/pyproject.toml"
  - "**/package.json"
  - "**/package-lock.json"
  - "**/Pipfile"
  - "**/Pipfile.lock"
  - "**/poetry.lock"
  - "**/setup.py"
  - "**/setup.cfg"
  - "**/uv.lock"
  - "**/yarn.lock"
  - "**/pnpm-lock.yaml"
  - "**/go.mod"
  - "**/go.sum"
  - "**/Cargo.toml"
  - "**/Cargo.lock"
  - "**/Gemfile*"

size:
  max_diff_lines: 300       # added + deleted; over this is T2
  max_deleted_files: 3      # more than this is T2

autonomy:
  promotion_count: 5        # consecutive clean merges to promote a category
  revert_window_days: 14

budget:
  per_issue_usd: 5.0
  per_day_usd: 25.0

queue:
  max_awaiting_human: 5
  max_open_proposals: 10

retries:
  max_rounds: 2

allowlisted_authors:
  - "RynoHooptyGIT"

routing:
  orchestration: none
  triage: haiku
  mechanical: haiku
  spec: sonnet
  build: sonnet
  sealed_test_author: opus
  verifier: opus
  retry_round_2: fable
  t2_design: fable

# Interim hardening: workers and gates run with only these variables.
# Never list tokens or keys here unless a worker strictly needs them.
env_allowlist:
  - "PATH"
  - "HOME"
  - "LANG"
  - "LC_ALL"
  - "TERM"
  - "TMPDIR"
  - "USER"

# Ledger and runtime logs live outside the repository (a worker's cwd must not contain them).
state_dir: "~/.local/state/myagents-factory"
