name: ci

# Runs the repo test entry point on every pull request and on main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml

      # Some tests create commits in temporary repos and need an identity.
      - name: Set a git identity for tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"

      - name: Run scripts/test.sh
        run: bash scripts/test.sh
