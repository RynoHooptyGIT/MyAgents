# Multi-Agent Coordination Configuration
# See: docs/specs/2026-04-26-multi-agent-coordination-design.md
# Read by scripts/lib/config.py's generic section loader. Only keys with an
# actual reader (a hook, script, or prompt that names the key) are listed —
# see "Config keys (2026-09-22)" in the design doc for what was removed and why.

coordination:
  # Heartbeat
  heartbeat_interval_calls: 20       # Update heartbeat every N tool calls (read by .agents/hooks/heartbeat.sh)
  stale_threshold_minutes: 10        # Consider agent dead after N minutes no heartbeat (read by claude-commands/team/agent-coordinator.md)

# Instinct capture loop (learned behaviors). See: docs/specs/2026-09-19-instinct-capture-loop-design.md
instincts:
  enabled: true
  model: haiku                 # miner model for `claude -p`
  min_candidates: 3            # prefilter gate before spawning the miner
  inject_limit: 6              # max instincts injected at SessionStart
  inject_max_chars: 2000
  min_confidence: 0.7          # eligible for injection
  auto_accept_confidence: 0.7  # Oracle auto mode accepts pending >= this
  decay_per_week: 0.02
  observations_max_mb: 10
  pending_ttl_days: 30
